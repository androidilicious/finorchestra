[project]
name = "finorchestra"
version = "0.1.0"
description = "Macro-financial portfolio intelligence: point-in-time signals, LLM and rule-based macro views, constrained allocation, leakage-controlled evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Duke CAP2027 Team 4" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "osqp>=0.6",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "matplotlib>=3.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "yfinance>=0.2.40",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
finorchestra = "finorchestra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finorchestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the pulled raw data store"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
